<head><link rel="stylesheet" href="./__variables.css"></head>
<body>
<style>
    .container {
        width: 100vw;
        height: 100vh;
        display: grid;
        grid-template-columns: repeat(var(--columns), 1fr);
        grid-template-rows: repeat(var(--rows), 1fr);
    }

    .center-image {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        width: 80vw;
        background-color: rgba(255, 255, 255, 0.8);
        box-shadow: 
            0 0 10px rgba(255, 255, 255, 0.8),
            0 0 20px rgba(255, 255, 255, 0.6),
            0 0 30px rgba(255, 255, 255, 0.4),
            0 0 40px rgba(255, 255, 255, 0.2);
    }

    .logo-container {
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .logo-container img {
        max-width: 70%;
        max-height: 70%;
        object-fit: contain;

        animation: rotate_image var(--random-time) linear infinite;
        transform-origin: 50% 50%;
    }

    @keyframes rotate_image {
        100% {
            transform: rotate(360deg);
        }
    }
    
</style>
<template id="logo" class="logo">
    <img src="../../public/images/logo.png">
</template>

<div class="container" id="container">
    <img src="../../public/images/logo.png" alt="Center Image" class="center-image">
</div>
<script>
    const container = document.getElementById('container');
    const logo = document.getElementById('logo');
    for (let col = 0; col < 7; col++) {
        for (let row = 0; row < 12; row++) {
            const clone = logo.content.cloneNode(true);
            const div = document.createElement('div');
            div.className = 'logo-container';
            div.style.gridColumn = `${col + 1}`;
            div.style.gridRow = `${row + 1}`;
            div.style.setProperty('--random-time', `${Math.random() * 30 + 0.3}s`)
            div.appendChild(clone);
            container.appendChild(div);
        }
    }
</script>
</body>
