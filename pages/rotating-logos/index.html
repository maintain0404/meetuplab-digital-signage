<head></head>
<body>
<style>
    /* body styles */
    body {
        margin: 0;
        padding: 0;
    }

    @media (prefers-color-scheme: light) {
        body {
            background-color: white;
            color: black;
        }
    }

    @media (prefers-color-scheme: dark) {
        body {
            background-color: black;
            color: white;
        }
    }

    /* Theme query parameter overrides */
    body[data-theme="light"] {
        background-color: white;
        color: black;
    }

    body[data-theme="dark"] {
        background-color: black;
        color: white;
    }

    /* 전체 배치용 컨테이너 div */
    .container {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-wrap: wrap;
        flex-direction: row;
        justify-content: space-between;;
        align-items: center;
    }

    {{/* 작은 로고 담은 div */}}
    .logo-container {
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 0;
    }

    .logo-container div {
        width: 70%;
        height: 70%;
        z-index: -1;
        animation: rotate_image var(--random-time) linear infinite;
        transform-origin: 50% 50%;
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
    }

    @media (prefers-color-scheme: light) {
        .logo-container div {
            background-image: url('../../public/images/logo-black-title-black-subtitle.png');
        }
    }

    @media (prefers-color-scheme: dark) {
        .logo-container div {
            background-image: url('../../public/images/logo-white-title-white-subtitle.png');
        }
    }

    /* Theme query parameter overrides for logo-container */
    body[data-theme="light"] .logo-container div {
        background-image: url('../../public/images/logo-black-title-black-subtitle.png');
    }

    body[data-theme="dark"] .logo-container div {
        background-image: url('../../public/images/logo-white-title-white-subtitle.png');
    }

    /* 중앙 이미지 컨테이너 */
    .center-image-container {
        position: fixed;
        left: 0%;
        top: 0%;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1;
    }

    .center-image-container div {
        width: 300px;
        max-width: 50%;
        height: 100%;
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 2;
    }

    @media (prefers-color-scheme: light) {
        .center-image-container div {
            background-image: url('../../public/images/logo-black-title-black-subtitle.png');
        }
    }

    @media (prefers-color-scheme: dark) {
        .center-image-container div {
            background-image: url('../../public/images/logo-white-title-white-subtitle.png');
        }
    }

    /* Theme query parameter overrides for center-image-container */
    body[data-theme="light"] .center-image-container div {
        background-image: url('../../public/images/logo-black-title-black-subtitle.png');
    }

    body[data-theme="dark"] .center-image-container div {
        background-image: url('../../public/images/logo-white-title-white-subtitle.png');
    }

    @keyframes rotate_image {
        100% {
            transform: rotate(360deg);
        }
    }

</style>
<template id="small-logo-template">
    <div></div>
</template>
<div class='center-image-container'>
    <div id='center-image'></div>
    <dialog>
        <p>Dialog content goes here.</p>
        <button id="close-dialog">Close</button>
    </dialog>
</div>
<div id="container" class="container">
</div>
<script>
    // Apply theme from query parameter
    const applyTheme = () => {
        const url = new URL(document.URL);
        const theme = url.searchParams.get('theme');
        if (theme === 'light' || theme === 'dark') {
            document.body.setAttribute('data-theme', theme);
        }
    };
    applyTheme();

    let blockWidth = 80; // px
    let blockHeight = blockWidth // px

    const setConfig = () => {
    
    }

    const container = document.getElementById('container');
    const smallLogoTemplate = document.getElementById('small-logo-template');
    const render = () => {
        // clear inner container
        container.innerHTML = '';

        // 그리드 계산
        const columnsCount = Math.floor(window.innerWidth / blockWidth);
        const rowsCount = Math.floor(window.innerHeight / blockHeight);

        // 중앙 위치
        const centerCol = columnsCount / 2;
        const centerRow = rowsCount / 2;

        // 최대 거리 계산 (대각선 거리)
        const maxDistance = Math.sqrt(
            Math.pow(centerCol, 2) + Math.pow(centerRow, 2)
        );

        for(let row = 0; row < rowsCount; row++) {
            for(let col = 0; col < columnsCount; col++) {
                // 현재 위치에서 중앙까지의 거리
                const distance = Math.sqrt(
                    Math.pow(col - centerCol, 2) + 
                    Math.pow(row - centerRow, 2)
                );
                
                // 거리에 따른 opacity (0 ~ 1)
                // 중앙=1, 모서리=0.1 등으로 조정 가능
                const opacity = (distance / maxDistance) * 0.9; // 최소 0.1
    
                const clone = smallLogoTemplate.content.cloneNode(true);
                const div = document.createElement('div');
                div.className = 'logo-container';
                div.style.setProperty('width', `${blockWidth}px`)
                div.style.setProperty('height', `${blockHeight}px`)
                div.style.setProperty('--random-time', `${Math.random() * 30 + 0.3}s`)
                div.style.setProperty('opacity', opacity);
                div.appendChild(clone);
                container.appendChild(div)
            }
        }
    }

    render();

    window.addEventListener('resize', () => {
        render();
    });
</script>
</body>
