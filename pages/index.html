<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage Dashboard</title>
    <link rel="stylesheet" href="https://davidpaulsson.github.io/no-class/css/no-class.min.css" type="text/css">
</head>
<body>
<!-- Preview Container -->
<div class="container">
    <div class="small-page-container">
        <h3>Rotating Logos</h3>
        <div class="small-page-wrapper">
            <iframe 
                id="rotating-iframe"
                src="./rotating-logos/index.html" 
                frameborder="0" 
                allow="autoplay; encrypted-media" 
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
        </div>
        <div class="page-description">
            <p>회전하는 로고 배경을 표시합니다.</p>
        </div>
        <div class="page-editor">
            <h4>화면 설정</h4>
            <p class="editor-description">아래 옵션을 선택하여 화면을 커스터마이징할 수 있습니다.</p>
            <div class="form-group">
                <label for="rotating-theme">
                    표시 모드
                    <span class="form-help">화면을 밝거나 어둡게 표시합니다</span>
                </label>
                <select id="rotating-theme">
                    <option value="">시스템 기본값</option>
                    <option value="light">밝음</option>
                    <option value="dark">어두움</option>
                </select>
            </div>
            <button onclick="applyRotatingLogos()" class="editor-button">미리보기</button>
            <button onclick="applyRotatingLogosFullscreen()" class="editor-button">전체화면으로</button>
        </div>
    </div>

   <div class="small-page-container">
        <h3>Logo with Video</h3>
        <div class="small-page-wrapper">
            <iframe 
                id="video-iframe"
                src="./logo-with-video/index.html" 
                frameborder="0" 
                allow="autoplay; encrypted-media" 
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
        </div>
        <div class="page-description">
            <p>중앙 로고가 있는 동영상 배경을 표시합니다.</p>
        </div>
        <div class="page-editor">
            <h4>화면 설정</h4>
            <p class="editor-description">아래 옵션을 선택하여 화면을 커스터마이징할 수 있습니다.</p>
            <div class="form-group">
                <label for="video-id">
                    동영상
                    <span class="form-help">재생할 유튜브 동영상을 선택합니다</span>
                </label>
                <input type="text" id="video-id" placeholder="YouTube 동영상 ID" value="jnLSYfObARA">
            </div>
            <div class="form-group">
                <label for="video-theme">
                    표시 모드
                    <span class="form-help">화면을 밝거나 어둡게 표시합니다</span>
                </label>
                <select id="video-theme">
                    <option value="">시스템 기본값</option>
                    <option value="light">밝음</option>
                    <option value="dark">어두움</option>
                </select>
            </div>
            <button onclick="applyLogoWithVideo()" class="editor-button">미리보기</button>
            <button onclick="applyLogoWithVideoFullscreen()" class="editor-button">전체화면으로</button>
        </div>
    </div>
</div>

<style>
    /* Layout only */
    body {
        margin: 0;
        padding: 0;
    }

    .container {
        width: 100vw;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 2em;
        overflow-x: hidden;
        padding: 20px;
    }

    .small-page-container {
        display: flex;
        flex-direction: column;
        border: 1px solid;
        border-radius: 8px;
        padding: 15px;
        overflow: hidden;
    }

    .small-page-container h3 {
        margin: 0 0 15px 0;
    }

    .small-page-container .small-page-wrapper {
        aspect-ratio: 16 / 9;
        min-height: 0; 
        min-width: 0;
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 15px;
    }

    .small-page-container .small-page-wrapper iframe {
        width: 400%;
        height: 400%;
        transform: scale(0.25, 0.25);
        transform-origin: 0 0;
    }

    .page-description {
        padding: 10px;
        margin-bottom: 15px;
    }

    .page-description p {
        margin: 0;
    }

    .page-editor {
        padding: 15px;
        border-radius: 6px;
    }

    .page-editor h4 {
        margin: 0 0 12px 0;
    }

    .form-group {
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
    }

    .form-group label {
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .form-group input,
    .form-group select {
        padding: 8px;
        border: 1px solid;
        border-radius: 4px;
    }

    .editor-button {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        margin-top: 8px;
    }

    .parameter-display {
        margin-top: 10px;
        padding: 8px;
        border-radius: 4px;
        word-break: break-all;
        cursor: pointer;
        transition: background-color 0.2s, border 0.2s;
        border: 1px solid transparent;
    }
</style>
<script>
    // Load current parameters from URL
    const loadCurrentParams = () => {
        const url = new URL(window.location);
        const rotatingTheme = url.searchParams.get('rotating-theme') || '';
        const videoId = url.searchParams.get('videoId') || 'jnLSYfObARA';
        const videoTheme = url.searchParams.get('video-theme') || '';

        document.getElementById('rotating-theme').value = rotatingTheme;
        document.getElementById('video-id').value = videoId;
        document.getElementById('video-theme').value = videoTheme;

        updateCurrentParams();
    };

    const updateCurrentParams = () => {
        const rotatingTheme = document.getElementById('rotating-theme').value;
        const videoId = document.getElementById('video-id').value;
        const videoTheme = document.getElementById('video-theme').value;

        const rotatingUrl = rotatingTheme 
            ? `./rotating-logos/index.html?theme=${rotatingTheme}` 
            : './rotating-logos/index.html';
        const videoUrl = `./logo-with-video/index.html?videoId=${videoId}${videoTheme ? `&theme=${videoTheme}` : ''}`;

        currentUrls.rotating = rotatingUrl;
        currentUrls.video = videoUrl;

        document.getElementById('rotating-current').innerHTML = `<strong>URL:</strong><br>${rotatingUrl}`;
        document.getElementById('video-current').innerHTML = `<strong>URL:</strong><br>${videoUrl}`;
    };

    const applyRotatingLogos = () => {
        const theme = document.getElementById('rotating-theme').value;
        let url = './rotating-logos/index.html';
        if (theme) {
            url += `?theme=${theme}`;
        }
        document.getElementById('rotating-iframe').src = url;
    };

    const applyRotatingLogosFullscreen = () => {
        applyRotatingLogos();
        
        // 전체화면으로 전환
        const rotatingFrame = document.getElementById('rotating-iframe');
        if (rotatingFrame.requestFullscreen) {
            rotatingFrame.requestFullscreen();
        }
    };

    const applyLogoWithVideo = () => {
        const videoId = document.getElementById('video-id').value || 'jnLSYfObARA';
        const theme = document.getElementById('video-theme').value;
        let url = `./logo-with-video/index.html?videoId=${videoId}`;
        if (theme) {
            url += `&theme=${theme}`;
        }
        document.getElementById('video-iframe').src = url;
    };

    const applyLogoWithVideoFullscreen = () => {
        applyLogoWithVideo();
        
        // 전체화면으로 전환
        const videoFrame = document.getElementById('video-iframe');
        if (videoFrame.requestFullscreen) {
            videoFrame.requestFullscreen();
        }
    };

    // Initialize on page load
    window.addEventListener('load', () => {
        loadCurrentParams();
    });

</script>
</body>
