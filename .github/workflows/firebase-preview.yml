name: Firebase PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy PR Preview
        id: firebase-deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: meetuplabappscript
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d

      - name: Comment preview URL
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Visit the preview URL for this PR (updated for commit ${{ github.event.pull_request.head.sha }}):\n\n🔥 ${{ steps.firebase-deploy.outputs.details_url }}/pages/index.html 🔥\n\n<sub>Sign in to this preview URL will be disabled. [Learn more](https://firebase.google.com/docs/hosting/manage-hosting-resources)</sub>`
            })
